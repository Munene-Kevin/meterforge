spring.application.name=meterforge

# Use in-memory H2 database for local/offline builds and testing
spring.datasource.url=jdbc:h2:mem:meterforge;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable Flyway for in-memory H2 runs to avoid DB-specific migrations
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
